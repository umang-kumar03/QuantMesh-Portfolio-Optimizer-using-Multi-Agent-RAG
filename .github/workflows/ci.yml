name: QuantMesh checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: quantmesh_test
          POSTGRES_PASSWORD: test-only-ci-password
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d quantmesh_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUANTMESH_TEST_DATABASE_URL: postgresql://postgres:test-only-ci-password@127.0.0.1:5432/quantmesh_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -c constraints.txt -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit==2.10.1
      - run: pip-audit --disable-pip --no-deps -r constraints.txt --progress-spinner off
