[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quantmesh"
version = "0.2.0"
description = "Reproducible portfolio research with evidence-grounded analysis"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "pandas==2.2.3", "scipy==1.15.3", "plotly==6.1.2", "streamlit==1.54.0", "pillow==12.3.0", "requests==2.34.2"]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.11.11"]

[tool.setuptools.packages.find]
include = ["quantmesh*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
